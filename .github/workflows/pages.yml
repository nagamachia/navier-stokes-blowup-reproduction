name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site/data _site/figures
          cp web/index.html web/viewer.js _site/
          cp results/reference/taylor_green_numerical_n32.vtk _site/data/
          cp results/reference/taylor_green_reference_n16.vtk _site/data/
          if [ -f results/figures/taylor_green_3d.gif ]; then
            cp results/figures/taylor_green_3d.gif _site/figures/
          fi
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
